<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./assets/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Boldonse&family=Gemunu+Libre:wght@200..800&family=Glory:ital,wght@0,100..800;1,100..800&display=swap"
        rel="stylesheet">

    <title>Todo List</title>
</head>

<body>
    <section class="container p-3">
        <div class="cards card container p-3 rounded-0">
            <div class="inputs input-group mb-3 text-center d-flex">
                <input class="form-control border-0" type="text" placeholder="Enter new task here">
                <div class="p-1">
                    <button onclick="addTask()" class="create btn btn-primary rounded-0">Create</button>
                </div>
            </div>
            <p></p>

            <div class="all mb-2 text-center">
                <button
                    class="al filter-btn filter-btn border-0 bg-light text-black link-offset-2 link-underline link-underline-opacity-0"
                    href="">all</button>
                <button
                    class="todo filter-btn  filter-btn border-0 bg-light text-black link-offset-2 link-underline link-underline-opacity-0"
                    href="">todo</button>
                <button
                    class="completed filter-btn filter-btn border-0 bg-light text-black link-offset-2 link-underline link-underline-opacity-0"
                    href="">completed</button>
            </div>
            <div class="filter-indicator">
                <span></span>
            </div>
            <div class="tasks">
                <!-- <button class=""></button> -->
            </div>
        </div>
    </section>
</body>
<script src="./assets/script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</html>
